<!doctype html>
<html lang="{{ or site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">

<head>
  {{ partial "head.html" . }}
</head>

<body>
  <div class="mx-auto flex max-w-[85ch] flex-col space-y-10 p-4 md:p-6">
    <header class="flex flex-row items-center justify-between text-[clamp(0.7rem,3vw,1rem)]">
      {{ partial "header.html" . }}
    </header>
    <main class="prose prose-slate max-w-none relative md:prose-lg prose-h1:text-[2em]" id="maincontent">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="mt-20 border-t border-neutral-100 pt-2 text-xs">
      {{ partial "footer.html" . }}
    </footer>
  </div>
  {{ if .Store.Get "hasMermaid" }}
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.0/dist/mermaid.min.js"
    integrity="sha256-G8ouPAnw4zzMbnAenHnVz6h9XpKbNdOkrqTh7AadyHs=" crossorigin="anonymous"></script>
  <script type="text/javascript">
    mermaid.initialize({
      startOnLoad: true,
      theme: 'neutral',
      fontFamily: "'SourceSerif4', sans-serif"
    });
  </script>
  {{ end }}
</body>

</html>
