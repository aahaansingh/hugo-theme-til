<ol class="not-prose {{ .class }}">
  {{- range .pages }}
    <li>
      <article class="flex flex-row items-center gap-x-3">
        <header class="grow truncate">
          <h3 class="flex items-center">
            <a
              href="{{ .RelPermalink }}"
              class="truncate text-base"
              title="{{ .Title }}"
              >{{ .Title }}</a
            >
          </h3>
        </header>
        {{- with first 2 (.Page.GetTerms "categories") }}
          <ul class="hidden shrink-0 flex-row flex-wrap items-center justify-end gap-1 md:flex">
            {{- range . }}
              <li>
                <a
                  href="{{ .RelPermalink }}"
                  class="taxonomy"
                  title="Posts and notes on {{ .LinkTitle }}"
                  >{{ .LinkTitle }}</a
                >
              </li>
            {{- end }}
          </ul>
        {{- end }}
      </article>
    </li>
  {{- end }}
</ol>
