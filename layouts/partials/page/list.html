<ol class="not-prose {{ .class }}">
  {{- range .pages }}
    <li>
      <article class="flex flex-row items-center gap-x-3">
        <header class="grow">
          <h3>
            <a
              href="{{ .RelPermalink }}"
              class="truncate text-sm"
              title="{{ .Title }}"
              >{{ .Title | title }}</a
            >
          </h3>
        </header>
        {{- with .Page.GetTerms "categories" }}
          <ul class="flex shrink-0 flex-row flex-wrap items-center justify-end gap-2">
            {{- range . }}
              <li>
                <a
                  href="{{ .RelPermalink }}"
                  class="taxonomy"
                  title="Posts and notes on {{ .LinkTitle }}"
                  >{{ .LinkTitle }}</a
                >
              </li>
            {{- end }}
          </ul>
        {{- end }}
      </article>
    </li>
  {{- end }}
</ol>
